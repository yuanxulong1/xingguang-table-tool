<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星光 · 表格合并演示</title><style>body{font:16px/1.7 Arial,"Microsoft YaHei",sans-serif;max-width:900px;margin:36px auto;padding:20px;color:#171717;background:#f7f7f8}h1{color:#002fa7}textarea{width:100%;height:150px;font:15px/1.6 monospace;box-sizing:border-box;padding:12px}button{padding:12px 20px;background:#002fa7;color:white;border:0;font:inherit;cursor:pointer}pre{padding:20px;background:white;overflow:auto;border:1px solid #ccc}label{display:block;margin:20px 0 8px}a{color:#002fa7}</style><h1>星光表格合并演示</h1><p>将 Excel 中的表头和数据复制粘贴到下方两个文本框。本演示仅支持简单制表符分隔文本、同名列合并和整行去重；不支持单元格内换行或制表符。所有计算在本地进行。</p><label for="a">表格一</label><textarea id="a">编号	姓名
001	林一
002	周二</textarea><label for="b">表格二</label><textarea id="b">姓名	编号
周二	002
陈三	003</textarea><p><button id="run">合并并去重</button></p><pre id="out" role="status">点击按钮查看结果。</pre><p>完整离线版支持 Excel / CSV 文件导入与导出。<a href="https://afdian.com/a/autooffice">星光的爱发电主页</a>（上架状态以主页为准）</p><script>
/* MIT License. Copyright (c) 2026 Xingguang.
Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the "Software"), to deal in the Software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so, subject to the following conditions: The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software. THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE. */
document.getElementById('run').onclick=()=>{const out=document.getElementById('out');try{const data=['a','b'].map(id=>{const s=document.getElementById(id).value;if(s.length>100000)throw Error('演示最多支持每段 100,000 字符。');const lines=s.trim().split(/\r?\n/).map(l=>l.split('\t'));const headers=lines.shift().map(s=>s.trim());if(headers.some(h=>!h)||new Set(headers).size!==headers.length)throw Error('表头不能为空或重名。');return {headers,lines};});const headers=data[0].headers;const all=[],seen=new Set();let total=0;for(const t of data){if(t.headers.length!==headers.length||t.headers.some(h=>!headers.includes(h)))throw Error('演示版要求两份表格列名一致。');for(const r of t.lines){if(r.length!==headers.length)throw Error('每行列数必须与表头一致。');const row=headers.map(h=>r[t.headers.indexOf(h)]);total++;const key=JSON.stringify(row);if(!seen.has(key)){seen.add(key);all.push(row);}}}out.textContent='输入 '+total+' 行，保留 '+all.length+' 行。\n\n'+[headers,...all].map(r=>r.join('\t')).join('\n');}catch(e){out.textContent=e.message;}};
</script></html>
